# GLM-5.2 MXFP8-NVFP4-NF3 Hybrid — TP4/DCP4, v20 dynamic-KV + auto-calibration.
#
# Full production flag set (validated ladder / concurrency / needle lineage),
# with every hand-tuned comm knob replaced by boot-time measurement:
#   - NCCL_P2P_LEVEL=auto  -> measured P2P level (verified traffic, cached)
#   - wire mode UNSET      -> measured i8 transport race (i8/i8_ring/i8_a2a)
#   - dynamic per-token NVFP4 KV scaling ON by default in this posture
#     (the deep-retrieval fix; sparkinfer#86 + vllm#189)
#   - quality-first online-MXFP8 membership (credit: destroyed)
# Explicit values always override any auto behavior.
#
# Node: 4x RTX PRO 6000 (96 GB, SM120). Deploy: edit the /model and cache
# volume paths, then: docker compose -f <this file> up -d
# First boot: ~1-2 min "[autocal]" phase, then normal load (cold compile can
# take tens of minutes; the 2600s health start_period covers it).

services:
  g52h:
    # tag gilded-gnosis-v20-release-autocal-20260728 (digest pinned on push)
    image: ghcr.io/yatesdr/glm52-serve@sha256:4ea6bcf668caa44a8779a19ee80c108b6dc85ecbb8a7baaedadde27371b5a733
    pull_policy: missing
    container_name: glm52-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2600s   # clears worst-case cold boot (weights+compile+offload)
    labels:
      - autoheal=true
    ports:
      - "0.0.0.0:5001:5001"
    gpus: all
    ipc: "host"           # shares host /dev/shm — offload mmap lives there
    ulimits:
      memlock: -1
      nofile: 1048576
    environment:
      # --- process / topology (single host) ---
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - CUDA_DEVICE_MAX_CONNECTIONS=32
      - CUTE_DSL_ARCH=sm_120a
      - TORCH_CUDA_ARCH_LIST=12.0a
      - OMP_NUM_THREADS=16
      - GLOO_SOCKET_IFNAME=lo
      - NCCL_SOCKET_IFNAME=lo
      - NCCL_IB_DISABLE=1
      # AUTO: measured at boot (probe -> static topo -> NCCL defaults).
      # Pin a level here (PXB/SYS/...) to skip measurement entirely.
      - NCCL_P2P_LEVEL=auto
      - NCCL_PROTO=LL,LL128,Simple
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - SAFETENSORS_FAST_GPU=1
      - LD_PRELOAD=/opt/libnccl-local-inference.so.2.30.4
      - VLLM_NCCL_SO_PATH=/opt/libnccl-local-inference.so.2.30.4
      - XDG_CACHE_HOME=/cache/jit
      - TRITON_CACHE_DIR=/cache/jit/triton
      # REQUIRED for the KV offload tier
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
      # --- checkpoint-specific knobs ---
      - KV_FP8_ROPE=1                 # 368 B compact KV record — required for 480k
      - NF3_GRID188=1
      - VLLM_NF3_GRID188_DECODE=1
      # NOTE: wire mode (SPARKINFER/VLLM/B12X_PCIE_DMA_FP8) is deliberately
      # UNSET: the entrypoint races i8/i8_ring/i8_a2a with verified traffic
      # and exports the fastest. Set any of those envs to pin it manually.
      # NOTE: VLLM_NVFP4_MLA_DYNAMIC_SCALE is deliberately UNSET: defaults
      # to 1 (on) in this posture. Set 0 to fall back to static scales.
      # --- b12x feature set ---
      - VLLM_USE_B12X_FP8_GEMM=1
      - VLLM_USE_B12X_MOE=1
      - VLLM_USE_B12X_SPARSE_INDEXER=1
      - VLLM_USE_B12X_WO_PROJECTION=1
      - VLLM_USE_B12X_MHC=1
      - VLLM_USE_B12X_DCP_A2A=1
      - VLLM_USE_B12X_PCIE_DMA=1
      - VLLM_USE_V2_MODEL_RUNNER=1
      - VLLM_USE_AOT_COMPILE=1
      - VLLM_USE_MEGA_AOT_ARTIFACT=1
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - VLLM_USE_BREAKABLE_CUDAGRAPH=0
      - B12X_W4A16_TC_DECODE=1
      - B12X_W4A8_TINY_DECODE=1
      - B12X_MLA_SM120_UNIFIED=1
      - B12X_DENSE_SPLITK_TURBO=1
      - B12X_MOE_FORCE_A16=1
      - B12X_MOE_FORCE_A8=0
      # --- DCP4 collective / prefill workspace ---
      - VLLM_DCP_GLOBAL_TOPK=1
      - VLLM_DCP_SHARD_DRAFT=1
      - VLLM_DCP_QUERY_SPLIT=0
      - VLLM_DCP_A2A_MAX_TOKENS=64
      - VLLM_DCP_A2A_LARGE_BACKEND=ag_rs
      - VLLM_DCP_PROJECT_BEFORE_MERGE=1
      - VLLM_DCP_PROJECT_BEFORE_MERGE_MIN_PREFILL_TOKENS=1024
      - VLLM_B12X_MLA_DCP_GATHER_IN_WORKSPACE=1
      - VLLM_B12X_MLA_CKV_GATHER=1
      # --- PCIe all-reduce ---
      - VLLM_ENABLE_PCIE_ALLREDUCE=1
      - VLLM_PCIE_ALLREDUCE_BACKEND=b12x
      - VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE=64KB
      - VLLM_PCIE_ONESHOT_FUSED_ADD_RMS_NORM_MAX_SIZE=84KB
      - SPARKINFER_PRINT_COMPILE_PROGRESS=1
      - TORCH_EXTENSIONS_DIR=/cache/v20_autocal_sparkinfer_ext
      # --- memory profiler ---
      - VLLM_MEMORY_PROFILE_INCLUDE_ATTN=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_DISABLED_KERNELS=MarlinFP8ScaledMMLinearKernel
    volumes:
      - /home/claude/LLM/GLM-5.2-hybrid:/model:ro         # <-- EDIT: model path
      - /home/claude/glm52-autocal/cache:/cache:rw        # <-- EDIT: JIT/AOT cache
      - /home/claude/glm52-autocal/cache:/root/.cache:rw
    # Auto-calibration entrypoint: measures comm settings (see header), clears
    # stale offload mmaps, then exec vllm serve with the args below.
    entrypoint: ["/usr/local/bin/serve-with-autocal.sh"]
    command:
      - /model
      - --served-model-name=GLM-5.2
      - --host=0.0.0.0
      - --port=5001
      - --trust-remote-code
      - --tensor-parallel-size=4
      - --decode-context-parallel-size=4
      - --dcp-comm-backend=a2a
      - --dcp-kv-cache-interleave-size=1
      - --kv-cache-dtype=nvfp4_ds_mla
      - --attention-backend=B12X_MLA_SPARSE
      - --moe-backend=b12x
      - --quantization=nvfp4_nf3_hybrid
      # Quality-first online-MXFP8 membership (credit: destroyed; KLD
      # 0.1333 vs 0.1462 static on our harness). Capacity-profile alternate
      # (quantized shared experts, higher KV pool):
      #   {"linear":{"weight":"mxfp8"},"shared_experts":{"weight":"mxfp8"},"ignore":["re:^model\\.layers\\.0\\.","re:.*\\.self_attn\\.indexer\\.","re:.*\\.mlp\\.gate$","model.layers.78.eh_proj","lm_head"]}
      - '--quantization-config={"linear":{"weight":"mxfp8"},"ignore":["re:.*\\.fused_qkv_a_proj$","re:.*\\.q_a_proj$","re:.*kv_a_proj_with_mqa","re:.*\\.mlp\\.gate$","model.layers.78.eh_proj","lm_head"]}'
      - --load-format=safetensors
      - -cc.pass_config.fuse_allreduce_rms=True
      # 0.970 is the stable ceiling WITH the offload tier; 0.975 OOMs on the
      # first real prefill. Raise only if you remove --kv-transfer-config.
      - --gpu-memory-utilization=0.970
      - --max-model-len=480000
      - --max-num-seqs=16
      - --max-num-batched-tokens=3072
      - --max-cudagraph-capture-size=64
      - --async-scheduling
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-flashinfer-autotune
      - --enable-auto-tool-choice
      - --tool-call-parser=glm47
      - --reasoning-parser=glm45
      - '--default-chat-template-kwargs={"reasoning_effort":"high"}'
      - --enable-prompt-tokens-details
      - --enable-force-include-usage
      - --enable-request-id-headers
      - '--hf-overrides={"use_index_cache":true,"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}'
      - '--speculative-config={"model":"/model","method":"mtp","num_speculative_tokens":3,"moe_backend":"b12x","draft_sample_method":"probabilistic"}'
      # GPU hot tier + 64 GB DRAM warm tier (extends prefix caching).
      # Remove for GPU-only (then GMU can rise).
      - '--kv-transfer-config={"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":64000000000,"secondary_tiers":[]}}'

  # Watchdog: restarts glm52-prod when its healthcheck reports unhealthy.
  # Needs the docker socket; delete this service if that is unacceptable.
  autoheal:
    image: willfarrell/autoheal@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    container_name: glm52-autoheal
    restart: unless-stopped
    network_mode: none
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
