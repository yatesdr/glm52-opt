name: glm52-v20-runtime-stride-fp8kv-bf16rope-lossless-r1-20260727

# Causal deep-retrieval cell after the official-reference needle-inclusion
# trace localized the miss before sparse attention.
#
# This is the highest-precision main-MLA-KV posture that is expected to hold
# the frozen 343,727-token request on four 96 GiB GPUs:
#   - fp8_ds_mla: FP8 NoPE/CKV values with BF16 RoPE in a 656 B/token record
#   - KV_FP8_ROPE=0: explicit, although the compact NVFP4-only RoPE writer is
#     already ineligible for fp8_ds_mla
#   - F8_DMA=0: uncompressed BF16 PCIe/DCP wire
#
# A fully BF16 MLA KV cache would require roughly 1,152 B/token and is not
# expected to fit this request on CN4. This cell therefore tests whether the
# production NVFP4-CKV + FP8-RoPE trajectory is the sufficient cause; it is
# not a literal all-BF16 model posture.

services:
  glm52-v20-stock:
    container_name: glm52-v20-runtime-stride-fp8kv-bf16rope-lossless-r1-20260727
    image: voipmonitor/vllm@sha256:131481b0f12c455a8fbad72c5909eb3a2c3accd96815743fdcfa134396e548c0
    entrypoint: ["/usr/local/bin/serve-gilded-gnosis.sh"]
    restart: "no"
    labels:
      autoheal: "false"
      local.glm52.production: "false"
      local.glm52.test: "fp8kv-bf16rope-lossless-wire-r1"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    ports:
      - "0.0.0.0:5001:5001"
    ipc: host
    shm_size: "32g"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      MODEL_FAMILY: glm52-hybrid
      MODEL: /model
      PORT: "5001"
      SERVED_MODEL_NAME: GLM-5.2
      TP: "4"
      DCP: "4"
      MTP: "0"
      DCP_PREFILL_WORKSPACE: auto
      PCIE_CALIBRATION: auto
      MAX_MODEL_LEN: "360000"
      MAX_NUM_SEQS: "1"
      MAX_BATCHED_TOKENS: "3072"
      GRAPH: "0"
      KV_CACHE_DTYPE: fp8_ds_mla
      KV_FP8_ROPE: "0"
      GPU_MEMORY_UTILIZATION: "0.950"
      NCCL_P2P_LEVEL: PXB
      F8_DMA: "0"
      VLLM_USE_B12X_SPARSE_INDEXER: "1"
      VLLM_DCP_QUERY_SPLIT: "0"
      VLLM_DCP_TOPK_OWNER_MERGE: "0"
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "0"
      VLLM_DISABLE_COMPILE_CACHE: "1"
    volumes:
      - /home/claude/LLM/GLM-5.2-hybrid:/model:ro
      - /home/derek/glm52-v20-runtime-stride-fp8kv-bf16rope-lossless-r1-cache:/cache:rw
      - /home/derek/glm52-v20-runtime-stride-fp8kv-bf16rope-lossless-r1-cache:/root/.cache:rw

networks:
  default:
    ipam:
      config:
        - subnet: 10.253.90.0/24
