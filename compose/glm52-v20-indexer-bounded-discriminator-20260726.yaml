name: longctx-indexer-bounded-v20

services:
  glm52-v20-candidate:
    container_name: glm52-v20-indexer-bounded-discriminator
    image: glm52-serve:v20-longctx-indexer-bounded-discriminator-20260726
    entrypoint: ["/usr/local/bin/serve-gilded-gnosis.sh"]
    restart: "no"
    labels:
      autoheal: "false"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    ports:
      - "0.0.0.0:5001:5001"
    ipc: host
    shm_size: "32g"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      MODEL_FAMILY: glm52-hybrid
      MODEL: /model
      PORT: "5001"
      SERVED_MODEL_NAME: GLM-5.2
      TP: "4"
      DCP: "4"
      MTP: "3"
      DCP_PREFILL_WORKSPACE: auto
      MAX_MODEL_LEN: "460000"
      MAX_NUM_SEQS: "16"
      MAX_BATCHED_TOKENS: "3072"
      GRAPH: "64"
      KV_FP8_ROPE: "1"
      GPU_MEMORY_UTILIZATION: "0.974"
      NCCL_P2P_LEVEL: PXB
      F8_DMA: i8_ring
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "0"
      SPARKINFER_NSA_TOPK_SELECTION_POLICY: bounded_compat
      VLLM_LONGCTX_TRACE_DIR: ""
      VLLM_LONGCTX_TRACE_BATCH_TOKENS: "2735"
      VLLM_LONGCTX_TRACE_MAX_LAYER: "78"
      VLLM_LONGCTX_INDEXER_TRACE_DIR: /indexer-trace
      VLLM_LONGCTX_INDEXER_TRACE_BATCH_TOKENS: "2735"
      VLLM_LONGCTX_INDEXER_TRACE_MAX_LAYER: "1"
    volumes:
      - /home/claude/LLM/GLM-5.2-hybrid:/model:ro
      - /home/claude/glm52-v20-prod-ready/cache:/cache:rw
      - /home/claude/glm52-v20-prod-ready/cache:/root/.cache:rw
      - /nvme-kv:/nvme-kv:rw
      - /home/derek/proof-results/20260726/longctx-indexer-bounded-discriminator/trace:/indexer-trace:rw
