name: glm52-v20-official-bf16-reference-runtime-stride-causal-20260727

services:
  glm52-v20-reference:
    container_name: glm52-v20-official-bf16-reference-runtime-stride-causal-20260727
    image: glm52-serve:v20-official-reference-runtime-stride-a38fc99a
    entrypoint: ["/usr/local/bin/serve-gilded-gnosis.sh"]
    restart: "no"
    labels:
      autoheal: "false"
      local.glm52.production: "false"
      local.glm52.test: "official-bf16-reference-runtime-stride-causal"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    ports:
      - "0.0.0.0:5001:5001"
    ipc: host
    shm_size: "32g"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      MODEL_FAMILY: glm52-hybrid
      MODEL: /model
      PORT: "5001"
      SERVED_MODEL_NAME: GLM-5.2
      TP: "4"
      DCP: "4"
      MTP: "0"
      DCP_PREFILL_WORKSPACE: auto
      PCIE_CALIBRATION: auto
      MAX_MODEL_LEN: "360000"
      MAX_NUM_SEQS: "1"
      MAX_BATCHED_TOKENS: "3072"
      # The diagnostic operator reads live request metadata and deliberately
      # returns without side effects during dummy graph capture. Any captured
      # decode graph would therefore bypass reference selection.
      GRAPH: "0"
      KV_FP8_ROPE: "1"
      # The diagnostic BF16 indexer cache is not included in vLLM's final
      # generic KV allocation. Leave explicit headroom for that cache and the
      # streamed FP32 score/key temporaries.
      GPU_MEMORY_UTILIZATION: "0.950"
      NCCL_P2P_LEVEL: PXB
      # Hold the lossless wire mode constant with the stock causal gate. The
      # reference scorer is the intended semantic variable.
      F8_DMA: i8_ring
      # This mode is deliberately server-static. It owns a BF16x128 indexer
      # cache whose layer prefix differs from the production uint8x132 cache.
      VLLM_GLM_INDEXER_REFERENCE_MODE: official_bf16_v1
      VLLM_USE_B12X_SPARSE_INDEXER: "1"
      # The reference operator performs local exact selection and the existing
      # deterministic DCP global merge. Query-split uses a different execution
      # contract and is rejected fail-closed by the implementation.
      VLLM_DCP_QUERY_SPLIT: "0"
      VLLM_DCP_TOPK_OWNER_MERGE: "0"
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "0"
      # The mode is not yet part of vLLM's persistent compile-cache key.
      # Disable reuse for this causal boot so a stock graph cannot be loaded.
      VLLM_DISABLE_COMPILE_CACHE: "1"
    volumes:
      - /home/claude/LLM/GLM-5.2-hybrid:/model:ro
      - /home/derek/glm52-v20-official-reference-runtime-stride-a38fc99a-cache:/cache:rw
      - /home/derek/glm52-v20-official-reference-runtime-stride-a38fc99a-cache:/root/.cache:rw

networks:
  default:
    ipam:
      config:
        - subnet: 10.253.86.0/24
