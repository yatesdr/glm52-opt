# Causal transport discriminator for the v20 NF3 long-context failure.
#
# The paired v19/v20 trace proved that the first layer-0 difference is exactly
# the large-batch embedding all-reduce: v20 preserves the checkpoint BF16 row,
# while the known-good v19 i8_ring configuration emits its block-INT8
# quantize/dequantize result.  The release launcher owns the three low-level
# wire variables and derives them from the public F8_DMA control, so the
# discriminator must set F8_DMA rather than trying to override its outputs.
# This override changes only that TP DMA wire mode and the trace destination.
# It keeps the exact v20 image, weights,
# TP4/DCP4/MTP3, NVFP4 MLA KV, FP8 RoPE, MNBT=3072, and prefetch=0 geometry.
# Trace instrumentation leaves capacity for 469,760 tokens, so this diagnostic
# advertises 460k rather than production's 480k.  The frozen causal request is
# 343,727 tokens; this changes only startup admission, not request arithmetic.
services:
  glm52-v20-candidate:
    image: glm52-serve:v20-longctx-trace-v2-20260726
    container_name: glm52-v20-longctx-trace-i8-ring-actual
    restart: "no"
    labels:
      autoheal: "false"
    environment:
      MAX_MODEL_LEN: "460000"
      F8_DMA: i8_ring
      VLLM_LONGCTX_TRACE_DIR: /trace
      VLLM_LONGCTX_TRACE_BATCH_TOKENS: "2735"
      VLLM_LONGCTX_TRACE_MAX_LAYER: "78"
    volumes:
      - /home/derek/proof-results/20260726/longctx-first-divergence/v20-i8-ring-actual:/trace:rw
