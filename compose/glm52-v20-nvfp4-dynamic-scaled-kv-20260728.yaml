# GLM-5.2 v20 — dynamic per-token NVFP4 MLA scaling.
# Image is the gate-tested artifact (digest = tested local image ID).
# Posture below is the exact production posture behind the published
# evidence: frozen retrieval 4/4, randomized ladder 6/6, KLD 0.139036 (n=3),
# prefill within 2% of static calibration, KV pool 550,144 @ 480k.
#
# REQUIREMENTS:
#  - fresh cache namespace on first boot (mode is server-static; records
#    written by other modes are unreadable by design)
#  - VLLM_NVFP4_MLA_SCALES_FILE must NOT be set (fail-closed if both)

name: glm52-v20-nvfp4-dynamic-scale

services:
  glm52:
    container_name: glm52-v20-nvfp4-dynamic-scale
    image: ghcr.io/yatesdr/glm52-serve@sha256:db82fdcb5756d4a547853ba1330538bdd8a3dc0c6443c29bc49ba77b69b51cd1
    entrypoint: ["/usr/local/bin/serve-gilded-gnosis.sh"]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    ports:
      - "0.0.0.0:5001:5001"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
    environment:
      MODEL_FAMILY: glm52-hybrid
      MODEL: /model
      PORT: "5001"
      SERVED_MODEL_NAME: GLM-5.2
      # --- tested production posture ---
      TP: "4"
      DCP: "4"
      MTP: "3"
      MAX_MODEL_LEN: "480000"
      MAX_NUM_SEQS: "16"
      MAX_BATCHED_TOKENS: "3072"
      GRAPH: "64"
      GPU_MEMORY_UTILIZATION: "0.9848"
      # Topology-specific (4x PCIe workstation, PXB fabric); re-derive per host
      NCCL_P2P_LEVEL: PXB
      F8_DMA: i8_ring
      SPARKINFER_NSA_TOPK_SELECTION_POLICY: exact
      VLLM_DCP_QUERY_SPLIT: "0"
      VLLM_DCP_TOPK_OWNER_MERGE: "0"
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "0"
      # --- the fix under review: self-describing per-token NVFP4 scales ---
      KV_FP8_ROPE: "1"
      VLLM_NVFP4_MLA_DYNAMIC_SCALE: "1"
    volumes:
      - /home/claude/LLM/GLM-5.2-hybrid:/model:ro
      # Fresh, mode-dedicated cache namespace (do not share with other modes)
      - /home/claude/glm52-v20-dynamic-scale/cache:/root/.cache:rw
