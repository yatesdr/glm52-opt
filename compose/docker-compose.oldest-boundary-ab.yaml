name: glm52-v20-pr84-selector-ab

services:
  glm52:
    container_name: glm52-v20-pr84-${SELECTION_POLICY:-exact}
    image: ${IMAGE_REF:?Set IMAGE_REF to the immutable GHCR image digest}
    entrypoint: ["/usr/local/bin/serve-gilded-gnosis.sh"]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    ports:
      - "5001:5001"
    ipc: host
    shm_size: "32g"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      MODEL_FAMILY: glm52-hybrid
      MODEL: /model
      PORT: "5001"
      SERVED_MODEL_NAME: GLM-5.2
      TP: "4"
      DCP: "4"
      MTP: "3"
      DCP_PREFILL_WORKSPACE: auto
      PCIE_CALIBRATION: force
      MAX_MODEL_LEN: "480000"
      MAX_NUM_SEQS: "16"
      MAX_BATCHED_TOKENS: "3072"
      GRAPH: "64"
      QUANTIZATION: nvfp4_nf3_hybrid
      ONLINE_QUANT: nf3-mxfp8
      NF3_GRID188: "1"
      MOE_MODE: a16
      KV_CACHE_DTYPE: nvfp4_ds_mla
      KV_FP8_ROPE: "1"
      LOAD_FORMAT: instanttensor
      INSTANTTENSOR_BACKEND: BUFFERED
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.9848}"
      NCCL_P2P_LEVEL: "${NCCL_P2P_LEVEL:-PXB}"
      F8_DMA: "${F8_DMA:-i8_ring}"
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "0"
      SPARKINFER_NSA_TOPK_SELECTION_POLICY: "${SELECTION_POLICY:-exact}"
    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to the checkpoint directory}:/model:ro
      - ${CACHE_DIR:?Use a separate absolute cache directory for each arm}:/cache:rw
      - ${CACHE_DIR:?Use a separate absolute cache directory for each arm}:/root/.cache:rw
