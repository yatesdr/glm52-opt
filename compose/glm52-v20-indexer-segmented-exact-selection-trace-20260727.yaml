name: glm52-v20-indexer-segmented-exact-selection-trace-20260727

services:
  glm52-v20-trace:
    container_name: glm52-v20-indexer-segmented-exact-selection-trace-20260727
    image: glm52-serve:v20-20260727-indexer-segmented-exact-selection-trace
    entrypoint: ["/usr/local/bin/serve-gilded-gnosis.sh"]
    restart: "no"
    labels:
      autoheal: "false"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    ports:
      - "0.0.0.0:5001:5001"
    ipc: host
    shm_size: "32g"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      MODEL_FAMILY: glm52-hybrid
      MODEL: /model
      PORT: "5001"
      SERVED_MODEL_NAME: GLM-5.2
      TP: "4"
      DCP: "4"
      MTP: "0"
      DCP_PREFILL_WORKSPACE: auto
      PCIE_CALIBRATION: auto
      MAX_MODEL_LEN: "360000"
      MAX_NUM_SEQS: "1"
      MAX_BATCHED_TOKENS: "3072"
      GRAPH: "6"
      KV_FP8_ROPE: "1"
      GPU_MEMORY_UTILIZATION: "0.974"
      NCCL_P2P_LEVEL: PXB
      F8_DMA: "0"
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "0"
      VLLM_DCP_INDEXER_SELECTION_POLICY: segmented_exact
      SPARKINFER_NSA_TOPK_SELECTION_POLICY: segmented_exact
      VLLM_INDEXER_SELECTION_TRACE_DIR: /trace
      VLLM_INDEXER_SELECTION_TRACE_BATCH_TOKENS: "2735"
      VLLM_INDEXER_SELECTION_TRACE_LAYERS: all
      VLLM_DISABLE_COMPILE_CACHE: "1"
    volumes:
      - /home/claude/LLM/GLM-5.2-hybrid:/model:ro
      - /home/claude/glm52-v20-prod-ready/cache:/cache:rw
      - /home/claude/glm52-v20-prod-ready/cache:/root/.cache:rw
      - /home/derek/proof-results/20260727/segmented-exact-cross-layer-trace-v1:/trace:rw
    networks:
      - trace_net

networks:
  trace_net:
    ipam:
      config:
        - subnet: 10.253.27.0/24
