# GLM-5.2 MXFP8-NVFP4-NF3 Hybrid — TP4/DCP4 best config on the STOCK v19 image.
#
# Runs on the stock Discord image (no custom pull) by calling `vllm serve` directly,
# same pattern as Lavd's compose — so none of our wrapper-script patches are needed.
#
# Node: 4x RTX PRO 6000 (96 GB). Deploy: edit the two /model + cache volume paths, then
#   docker compose -f GLM-5.2-hybrid-TP4.yaml up -d
#
# Two knobs are under active tuning (see inline NOTEs): the fp8 PCIe-DMA mode and the DCP
# comm backend. Values below are our current-best; the rest is validated (full ladder,
# conc 1-16 + 55k prefill + needle@50k/@350k, 0 errors, 0 restarts).
services:
  g52h:
    image: voipmonitor/vllm:gilded-gnosis-v19-vllm7ea567a-b12x4cfa530-fi801d57a-cu132-20260718
    container_name: g52h
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    gpus: all
    shm_size: "32g"
    ipc: "host"           # shares host /dev/shm — the 64 GB offload mmap lives there (see entrypoint cleanup)
    ulimits:
      memlock: -1
      nofile: 1048576
    environment:
      # --- process / topology (single host) ---
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - CUDA_DEVICE_MAX_CONNECTIONS=32
      - CUTE_DSL_ARCH=sm_120a
      - TORCH_CUDA_ARCH_LIST=12.0a
      - OMP_NUM_THREADS=16
      - GLOO_SOCKET_IFNAME=lo
      - NCCL_SOCKET_IFNAME=lo
      - NCCL_IB_DISABLE=1
      - NCCL_P2P_LEVEL=SYS
      - NCCL_PROTO=LL,LL128,Simple
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - SAFETENSORS_FAST_GPU=1
      - LD_PRELOAD=/opt/libnccl-local-inference.so.2.30.4
      - VLLM_NCCL_SO_PATH=/opt/libnccl-local-inference.so.2.30.4
      - XDG_CACHE_HOME=/cache/jit
      - TRITON_CACHE_DIR=/cache/jit/triton
      # --- REQUIRED for the KV offload tier: offload is incompatible with expandable_segments:True ---
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
      # --- our checkpoint-specific knobs (the ones that differ from a plain b12x run) ---
      - KV_FP8_ROPE=1                 # 368 B compact KV record — required to fit 480k
      - NF3_GRID188=1
      - VLLM_NF3_GRID188_DECODE=1     # v18 faster nf3 decode
      # --- b12x feature set ---
      - VLLM_USE_B12X_FP8_GEMM=1
      - VLLM_USE_B12X_MOE=1
      - VLLM_USE_B12X_SPARSE_INDEXER=1
      - VLLM_USE_B12X_WO_PROJECTION=1
      - VLLM_USE_B12X_MHC=1
      - VLLM_USE_B12X_DCP_A2A=1
      - VLLM_USE_B12X_PCIE_DMA=1
      - VLLM_USE_V2_MODEL_RUNNER=1
      - VLLM_USE_AOT_COMPILE=1
      - VLLM_USE_MEGA_AOT_ARTIFACT=1
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - VLLM_USE_BREAKABLE_CUDAGRAPH=0
      - B12X_W4A16_TC_DECODE=1
      - B12X_W4A8_TINY_DECODE=1
      - B12X_MLA_SM120_UNIFIED=1
      - B12X_DENSE_SPLITK_TURBO=1
      - B12X_MOE_FORCE_A16=1          # expert activation path only; NVFP4/NF3 weights untouched
      - B12X_MOE_FORCE_A8=0
      # --- DCP4 collective / prefill workspace ---
      - VLLM_DCP_GLOBAL_TOPK=1
      - VLLM_DCP_SHARD_DRAFT=1
      - VLLM_DCP_QUERY_SPLIT=0
      - VLLM_DCP_A2A_MAX_TOKENS=64
      - VLLM_DCP_A2A_LARGE_BACKEND=ag_rs
      - VLLM_DCP_PROJECT_BEFORE_MERGE=1                      # dcp4 prefill workspace (needs batched=3072)
      - VLLM_DCP_PROJECT_BEFORE_MERGE_MIN_PREFILL_TOKENS=1024
      - VLLM_B12X_MLA_DCP_GATHER_IN_WORKSPACE=1
      - VLLM_B12X_MLA_CKV_GATHER=1
      # --- PCIe all-reduce + fp8 DMA ---
      - VLLM_ENABLE_PCIE_ALLREDUCE=1
      - VLLM_PCIE_ALLREDUCE_BACKEND=b12x
      - VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE=64KB
      - VLLM_PCIE_ONESHOT_FUSED_ADD_RMS_NORM_MAX_SIZE=84KB   # pairs with fuse_allreduce_rms
      # fp8 wire mode for the b12x PCIe all-reduce. KEEP AT 0 (bf16) for a 480k deep-context endpoint:
      # both "ag" (+10% 55k prefill) and "ring" (+24%) CORRUPT needle retrieval at 350k/480k on this
      # checkpoint (verified — empty results). fp8 is only safe up to ~200k context. 0 = bf16 = correct.
      - VLLM_PCIE_DMA_FP8=0
      - B12X_PCIE_DMA_FP8=0
      # --- memory profiler (helps the 480k GMU headroom estimate) ---
      - VLLM_MEMORY_PROFILE_INCLUDE_ATTN=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_DISABLED_KERNELS=MarlinFP8ScaledMMLinearKernel
    volumes:
      - /path/to/GLM-5.2-hybrid:/model:ro          # <-- EDIT: your checkpoint dir
      - /path/to/glm52-cache:/cache:rw             # <-- EDIT: writable JIT/AOT cache dir
      - /path/to/glm52-cache:/root/.cache:rw
    entrypoint:
      - /bin/sh
      - -c
      # clear stale offload mmaps from prior containers (ipc:host shares /dev/shm) so the 64 GB
      # offload region can allocate; without this a crowded /dev/shm crashes offload init.
      - 'rm -f /dev/shm/vllm_offload_*.mmap 2>/dev/null || true; exec vllm serve "$@"'
      - --
    command:
      - /model
      - --served-model-name=GLM-5.2
      - --host=0.0.0.0
      - --port=8000
      - --trust-remote-code
      - --tensor-parallel-size=4
      - --decode-context-parallel-size=4
      # NOTE (tuning): a2a is validated; ag_rs is the Discord decode tip we're testing next.
      - --dcp-comm-backend=a2a
      - --dcp-kv-cache-interleave-size=1
      - --kv-cache-dtype=nvfp4_ds_mla
      - --attention-backend=B12X_MLA_SPARSE
      - --moe-backend=b12x
      - --quantization=nvfp4_nf3_hybrid
      - '--quantization-config={"linear":{"weight":"mxfp8"},"shared_experts":{"weight":"mxfp8"},"ignore":["re:^model\\.layers\\.0\\.","re:.*\\.self_attn\\.indexer\\.","re:.*\\.mlp\\.gate$","model.layers.78.eh_proj","lm_head"]}'
      - --load-format=safetensors
      - -cc.pass_config.fuse_allreduce_rms=True
      # 480k context: GMU 0.970 is the stable ceiling WITH offload on. Raise past 0.970 only
      # if you drop the offload tier (--kv-transfer-config); 0.975 OOMs on the first real prefill.
      - --gpu-memory-utilization=0.970
      - --max-model-len=480000
      - --max-num-seqs=16
      - --max-num-batched-tokens=3072
      - --max-cudagraph-capture-size=64
      - --async-scheduling
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-flashinfer-autotune
      - --enable-auto-tool-choice
      - --tool-call-parser=glm47
      - --reasoning-parser=glm45
      - '--default-chat-template-kwargs={"reasoning_effort":"high"}'
      - --enable-prompt-tokens-details
      - --enable-force-include-usage
      - --enable-request-id-headers
      - '--hf-overrides={"use_index_cache":true,"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}'
      - '--speculative-config={"model":"/model","method":"mtp","num_speculative_tokens":3,"moe_backend":"b12x","draft_sample_method":"probabilistic"}'
      # KV offload: GPU hot tier + 64 GB DRAM warm tier (extends prefix caching). Remove this line
      # for GPU-only (then you can raise --gpu-memory-utilization).
      - '--kv-transfer-config={"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":64000000000,"secondary_tiers":[]}}'
