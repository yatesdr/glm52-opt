# NF3 5517197 — FLAT compose. No launcher, no preset, no inheritance.
#
# Every argument below was captured from /proc/<pid>/cmdline of a running launcher-driven boot on
# CN4 (2026-07-25), so this reproduces the launcher's *resolved* intent rather than my reading of
# its scripts. Rationale (Derek): launcher overlays hide configuration and cost us three separate
# failures in one evening —
#   1. MODEL defaulted to a HuggingFace repo id, re-downloading a 349 GB checkpoint already at /model
#   2. PORT defaulted to 8000 while the compose published and health-checked 5001
#   3. NCCL_P2P_LEVEL was hardcoded, silently discarding the compose value (patched, but invisible)
# None of it was visible in the compose. Here it is all explicit and diffable.
#
# Entrypoint is vllm directly. The image's serve-*.sh chain is deliberately bypassed.
services:
  glm52-v20-candidate:
    container_name: glm52-v20-candidate
    image: glm52-serve:v20-5517197-pxb-20260725   # e7a8a854 + launcher layer (layer now unused here)
    entrypoint: ["/opt/venv/bin/vllm"]
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    ports:
      - "0.0.0.0:5001:5001"
    ipc: host
    shm_size: "32g"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Transport / collectives — previously buried in the launcher.
      NCCL_P2P_LEVEL: PXB          # CN4: 10.1–11.3x faster packed-CKV gather than SYS
      GLOO_SOCKET_IFNAME: lo
      NCCL_SOCKET_IFNAME: lo
      # Wire codec. Selector was renamed; the old VLLM_* names are dead in this build and are
      # logged only as "Unknown vLLM environment variable". "0" = bf16 uncompressed (quality-safe).
      SPARKINFER_PCIE_DMA_FP8: "0"
      # KV record format: 368-byte FP8-RoPE. Omitting this silently yields a 432-byte BF16 record.
      KV_FP8_ROPE: "1"
      # DCP prefill policy — resolved by glm52-dcp-prefill-policy.sh inside the launcher and
      # captured here via DRY_RUN=1. These are exported at runtime, so `docker inspect` cannot
      # see them: a flat compose that omits them silently runs a DIFFERENT policy.
      VLLM_DCP_QUERY_SPLIT: "1"
      VLLM_B12X_MLA_CKV_GATHER: "1"
      VLLM_DCP_TOPK_OWNER_MERGE: "1"
      VLLM_DCP_INDEXER_SHARDS: "0"
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "1"
      VLLM_B12X_MLA_CKV_PREFETCH_WORKSPACE_MIB: "1024"
      VLLM_B12X_MLA_DCP_GATHER_IN_WORKSPACE: "1"
      VLLM_DCP_PROJECT_BEFORE_MERGE: "1"
      VLLM_DCP_PROJECT_BEFORE_MERGE_MIN_PREFILL_TOKENS: "1024"
      VLLM_B12X_ABSORB_BMM: "1"
      VLLM_USE_B12X_PCIE_DMA: "1"
      VLLM_NF3_GRID188_DECODE: "1"
      # Note: the launcher also sets VLLM_PCIE_DMA_FP8=0, which this vLLM logs as an unknown
      # variable. SparkInfer reads SPARKINFER_PCIE_DMA_FP8 (set above). Kept for parity//audit.
      VLLM_PCIE_DMA_FP8: "0"
      # --- The rest of what the launcher exports, captured from /proc/1/environ of a LIVE
      # launcher-driven boot (harness/cn4-evidence-archive/20260725/nf3-live-env.txt) and
      # filtered to exclude variables the image already provides via its own ENV.
      # An earlier flat compose built from `cmdline` + DRY_RUN alone omitted these and the
      # workers died with "No valid attention backend found" in the MTP draft path — the
      # backend is selected from env, not from --attention-backend.
      KV_CACHE_DTYPE: "nvfp4_ds_mla"
      VLLM_DCP_A2A_LARGE_BACKEND: "ag_rs"
      VLLM_DCP_A2A_MAX_TOKENS: "16"
      VLLM_DCP_GLOBAL_TOPK: "1"
      VLLM_DCP_SHARD_DRAFT: "1"
      VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE: "64KB"
      VLLM_PCIE_ONESHOT_FUSED_ADD_RMS_NORM_MAX_SIZE: "84KB"
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_B12X_DCP_A2A: "1"
      VLLM_USE_B12X_FP8_GEMM: "1"
      VLLM_USE_B12X_MHC: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_B12X_SPARSE_INDEXER: "1"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    command:
      - serve
      - /model                                   # LOCAL checkpoint — never a HF repo id in prod
      - --served-model-name=GLM-5.2
      - --host=0.0.0.0
      - --port=5001                              # launcher default was 8000
      - --trust-remote-code
      - --tensor-parallel-size=4
      - --decode-context-parallel-size=4
      - --dcp-comm-backend=a2a
      - --dcp-kv-cache-interleave-size=1
      - --kv-cache-dtype=nvfp4_ds_mla
      - --attention-backend=B12X_MLA_SPARSE
      - --moe-backend=b12x
      - --quantization=nvfp4_nf3_hybrid
      - '--quantization-config={"linear":{"weight":"mxfp8"},"shared_experts":{"weight":"mxfp8"},"ignore":["re:^model\\.layers\\.0\\.","re:.*\\.self_attn\\.indexer\\.","re:.*\\.mlp\\.gate$","model.layers.78.eh_proj","lm_head"]}'
      - --load-format=instanttensor
      - -cc.pass_config.fuse_allreduce_rms=True
      # 0.96 left only 3.24 GiB for KV against 3.57 GiB needed for one 480k request — boot failed
      # with an estimated max length of 434,688. 0.970 is the value our fa71 candidate ran.
      - --gpu-memory-utilization=0.97
      - --max-model-len=480000
      - --max-num-seqs=16
      - --max-num-batched-tokens=2048             # NF3 preset value, pinned explicitly
      - --max-cudagraph-capture-size=64
      - --async-scheduling
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-flashinfer-autotune
      - --enable-auto-tool-choice
      - --tool-call-parser=glm47
      - --reasoning-parser=glm45
      - '--default-chat-template-kwargs={"reasoning_effort":"high"}'
      - --enable-prompt-tokens-details
      - --enable-force-include-usage
      - --enable-request-id-headers
      - '--hf-overrides={"use_index_cache":true,"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}'
      # Draft model is explicit here; the launcher derived it from ${MODEL}, and other launchers in
      # this image use a separate MTP_MODEL variable — which is exactly the ambiguity this removes.
      - '--speculative-config={"model":"/model","method":"mtp","num_speculative_tokens":3,"moe_backend":"b12x","draft_sample_method":"probabilistic"}'
    volumes:
      - ${GLM52_MODEL_DIR:?set GLM52_MODEL_DIR}:/model:ro
      - ${GLM52_CACHE_DIR:?set GLM52_CACHE_DIR}:/cache:rw
      - ${GLM52_CACHE_DIR:?set GLM52_CACHE_DIR}:/root/.cache:rw
      - ${GLM52_NVME_DIR:?set GLM52_NVME_DIR}:/nvme-kv:rw
