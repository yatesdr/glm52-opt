# Full-spec production profile only: 480k max context, TP4/DCP4.
# MODEL_DIR is intentionally the sole required input.
services:
  glm52:
    image: ghcr.io/yatesdr/glm52-opt:0.1.0
    pull_policy: always
    restart: unless-stopped
    # Production posture: share the host IPC namespace so the 56 GB DRAM KV
    # tier lives in the host's /dev/shm, exactly as production runs it. The
    # host must provide /dev/shm >= ~64 GB (true on any box with four 96 GB
    # cards). If you cannot use host IPC, delete `ipc: host` and uncomment
    # `shm_size: 64gb` below to give the container its own shared memory.
    ipc: host
    # shm_size: 64gb
    ports:
      - "5001:5001"
    ulimits:
      memlock: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to the absolute checkpoint directory}:/model:ro
      - vllm-cache:/cache

volumes:
  vllm-cache:
